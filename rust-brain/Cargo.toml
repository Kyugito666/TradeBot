[package]
name    = "tradebot-brain"
version = "3.0.0"
edition = "2021"
authors = ["TradeBot Code-Architect"]

[[bin]]
name = "tradebot-brain"
path = "src/main.rs"

[dependencies]
memmap2    = "0.9"
libc       = "0.2"
rayon      = "1.10"
rand       = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
log        = "0.4"
env_logger = "0.11"
chrono     = { version = "0.4", features = ["serde"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
